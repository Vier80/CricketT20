<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>2026 T20 World Cup Predictor - Admin Console</title>
    
    <!-- Frameworks -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Export Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Oswald:wght@700&display=swap');

        :root {
            --brand-blue: #0f172a;
            --brand-orange: #f97316;
            --brand-accent: #38bdf8;
        }

        body { 
            font-family: 'Inter', sans-serif;
            background-color: var(--brand-blue); 
            color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: contain;
            margin: 0;
            padding: 0;
        }

        .title-font { font-family: 'Oswald', sans-serif; text-transform: uppercase; }

        .animate-fadeIn { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .orange-button { 
            background: linear-gradient(135deg, #fb923c 0%, #f97316 100%);
            box-shadow: 0 10px 25px -5px rgba(249, 115, 22, 0.4);
        }

        .glass-card { 
            background: rgba(30, 41, 59, 0.7); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(255,255,255,0.05);
        }
        
        .hero-logo-container {
            width: 85%;
            max-width: 240px; /* Ridotto di un ulteriore cm per estetica */
            filter: drop-shadow(0 0 30px rgba(249, 115, 22, 0.4));
            transition: transform 0.3s ease;
        }
        
        @media (min-width: 640px) {
            .hero-logo-container { max-width: 340px; }
        }

        input, select { font-size: 16px !important; border-radius: 12px; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: var(--brand-orange); border-radius: 10px; }

        .match-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); transition: all 0.3s; }
        .selected-winner { background: var(--brand-orange) !important; color: white !important; box-shadow: 0 0 20px rgba(249, 115, 22, 0.3); }
        
        .uo-btn { padding: 4px 8px; font-size: 10px; font-weight: 800; border-radius: 6px; border: 1px solid rgba(255,255,255,0.1); transition: all 0.2s; }
        .uo-btn.active { background-color: #38bdf8 !important; color: white !important; border-color: #38bdf8 !important; }

        .team-label {
            font-size: 10px;
            line-height: 1.1;
            font-weight: 900;
            text-transform: uppercase;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .toast-notification {
            position: fixed;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 200;
            min-width: 280px;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, Fragment } = React;
        const { jsPDF } = window.jspdf;

        // --- 1. DATI FISSI & CONFIGURAZIONE ---
        const CUSTOM_LOGO_URL = "https://upload.wikimedia.org/wikipedia/en/f/fa/2026_ICC_Men%27s_T20_World_Cup_logo.svg"; 

        const INITIAL_GROUPS = {
            A: [ { id: 'ind', name: 'India', code: 'in', rank: 1 }, { id: 'pak', name: 'Pakistan', code: 'pk', rank: 7 }, { id: 'ned', name: 'Olanda', code: 'nl', rank: 13 }, { id: 'usa', name: 'USA', code: 'us', rank: 18 }, { id: 'nam', name: 'Namibia', code: 'na', rank: 15 } ],
            B: [ { id: 'aus', name: 'Australia', code: 'au', rank: 2 }, { id: 'ire', name: 'Irlanda', code: 'ie', rank: 11 }, { id: 'oma', name: 'Oman', code: 'om', rank: 20 }, { id: 'sl', name: 'Sri Lanka', code: 'lk', rank: 8 }, { id: 'zim', name: 'Zimbabwe', code: 'zw', rank: 12 } ],
            C: [ { id: 'eng', name: 'Inghilterra', code: 'gb-eng', rank: 3 }, { id: 'ban', name: 'Bangladesh', code: 'bd', rank: 9 }, { id: 'ita', name: 'Italia', code: 'it', rank: 28 }, { id: 'nep', name: 'Nepal', code: 'np', rank: 17 }, { id: 'wi', name: 'West Indies', code: 'jm', rank: 6 } ],
            D: [ { id: 'nz', name: 'Nuova Zelanda', code: 'nz', rank: 4 }, { id: 'sa', name: 'Sudafrica', code: 'za', rank: 5 }, { id: 'can', name: 'Canada', code: 'ca', rank: 19 }, { id: 'afg', name: 'Afghanistan', code: 'af', rank: 10 }, { id: 'uae', name: 'Emirati Arabi', code: 'ae', rank: 16 } ]
        };

        const PHASES = { INTRO: 'intro', MATCHES: 'matches', STANDINGS: 'standings', SUPER8_MATCHES: 'super8_matches', SUPER8_STANDINGS: 'super8_standings', SEMIS_FINAL: 'semis_final', SUMMARY: 'summary', ADMIN: 'admin' };
        const TEAMS_MAP = {}; Object.values(INITIAL_GROUPS).forEach(g => g.forEach(t => TEAMS_MAP[t.id] = t));
        const ALL_GROUP_FIXTURES = {}; Object.keys(INITIAL_GROUPS).forEach(g => { const teams = INITIAL_GROUPS[g]; const f = []; for (let i = 0; i < teams.length; i++) for (let j = i + 1; j < teams.length; j++) f.push({ id: `${g}-${teams[i].id}-${teams[j].id}`, group: g, team1: teams[i], team2: teams[j] }); ALL_GROUP_FIXTURES[g] = f; });

        // --- 2. LOGICA DI SUPPORTO ---
        function b64Encode(str) { return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, (m, p) => String.fromCharCode('0x' + p))); }
        function b64Decode(str) { return decodeURIComponent(atob(str).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join('')); }
        
        function generateFixtures(teams, groupName) { 
            const f = []; if (!teams || teams.length < 2) return f; 
            for (let i = 0; i < teams.length; i++) for (let j = i + 1; j < teams.length; j++) f.push({ id: `${groupName}-${teams[i].id}-${teams[j].id}`, group: groupName, team1: teams[i], team2: teams[j] }); 
            return f; 
        }

        function calcRank(teams, fixtures, predictions) {
            let stats = teams.map(t => ({ ...t, points: 0 }));
            fixtures.forEach(m => { const w = predictions[m.id]?.w; if(w) { const idx = stats.findIndex(s => s.id === w); if(idx > -1) stats[idx].points += 2; } });
            return stats.sort((a, b) => b.points - a.points || a.rank - b.rank);
        }

        function getTeamsAtStage(results) {
            const matches = results || {};
            const gs = {}; Object.keys(INITIAL_GROUPS).forEach(g => { gs[g] = calcRank(INITIAL_GROUPS[g], ALL_GROUP_FIXTURES[g], matches); });
            const s8Teams = []; Object.values(gs).forEach(g => { if(g[0]) s8Teams.push(g[0].id); if(g[1]) s8Teams.push(g[1].id); });
            const G1 = [gs.A[0], gs.B[1], gs.C[0], gs.D[1]].filter(Boolean);
            const G2 = [gs.A[1], gs.B[0], gs.C[1], gs.D[0]].filter(Boolean);
            const s8f = { S8G1: generateFixtures(G1, 'S8G1'), S8G2: generateFixtures(G2, 'S8G2') };
            const s8s = { S8G1: calcRank(G1, s8f.S8G1, matches), S8G2: calcRank(G2, s8f.S8G2, matches) };
            const semiTeams = [];
            if(s8s.S8G1[0]) semiTeams.push(s8s.S8G1[0].id); if(s8s.S8G1[1]) semiTeams.push(s8s.S8G1[1].id);
            if(s8s.S8G2[0]) semiTeams.push(s8s.S8G2[0].id); if(s8s.S8G2[1]) semiTeams.push(s8s.S8G2[1].id);
            const finalists = [];
            if(matches['semi1']?.w) finalists.push(matches['semi1'].w);
            if(matches['semi2']?.w) finalists.push(matches['semi2'].w);
            return { s8: s8Teams, semis: semiTeams, finalists: finalists };
        }

        function calculateTotalScore(player, real) {
            if (!real || !player.matchPredictions) return 0;
            const hasMatches = real.matches && Object.keys(real.matches).length > 0;
            const hasChampion = !!real.champion;
            if (!hasMatches && !hasChampion) return 0;

            let score = 0;
            Object.keys(real.matches || {}).forEach(mid => {
                const pP = player.matchPredictions[mid]; const rR = real.matches[mid];
                if (!rR) return; if (rR.abandoned) { score += 1; return; } if (!pP) return;
                if (pP.w === rR.w) {
                    const winTeam = TEAMS_MAP[rR.w]; if (winTeam) score += winTeam.rank;
                    if (rR.r && pP.r === rR.r) score += 25;
                    if (rR.wk && pP.wk === rR.wk) score += 25;
                }
            });
            const rs = getTeamsAtStage(real.matches);
            const us = getTeamsAtStage(player.matchPredictions);
            us.s8.forEach(tid => { if(rs.s8.includes(tid)) score += 50; });
            us.semis.forEach(tid => { if(rs.semis.includes(tid)) score += 80; });
            us.finalists.forEach(tid => { if(rs.finalists.includes(tid)) score += 120; });
            const realRunnerUp = rs.finalists.find(id => id !== real.champion);
            const userRunnerUp = us.finalists.find(id => id !== player.championId);
            if(realRunnerUp && userRunnerUp && realRunnerUp === userRunnerUp) score += 180;
            if (real.champion && player.championId === real.champion) score += 250; 
            return score;
        }

        // --- 3. COMPONENTI UI ---

        function Flag({ id, size = "h-4" }) {
            const team = TEAMS_MAP[id]; if(!team) return null;
            const wi_flag = "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2MCA0MCI+PHJlY3Qgd2lkdGg9IjYwIiBoZWlnaHQ9IjQwIiBmaWxsPSIjN2EwMDM1Ii8+PGNpcmNsZSBjeD0iMzAiIGN5PSIzNSIgcj0iMTUiIGZpbGw9IiNmZmQxMDAiIG9wYWNpdHk9IjAuOCIvPjxwYXRoIGQ9Ik0zMCAxNSBMMzAgMzUgTTI1IDM1IEwzNSAzNSIgc3Ryb2tlPSJ3aGl0ZSIgc3Ryb2tlLXdpZHRoPSIyIi8+PHBhdGggZD0iTTMwIDE1IEwzNSAxMCBNMzAgMTUgTDI1IDEwIiBzdHJva2U9IiNmZmQxMDAiIHN0cm9rZS13aWR0aD0iMiIvPjwvc3ZnPg==";
            const url = id === 'wi' ? wi_flag : `https://flagcdn.com/w40/${team.code}.png`;
            return <img src={url} className={`${size} inline-block mr-1 shadow-sm rounded-sm object-contain`} crossOrigin="anonymous" />;
        }

        function T20Logo({ className }) {
            if (CUSTOM_LOGO_URL) return <img src={CUSTOM_LOGO_URL} className={`${className} object-contain rounded-2xl`} alt="World Cup 2026" />;
            return null;
        }

        function Header({ setPhase, phase, downloadRegolamentoPDF }) {
            return (
                <header className="h-20 glass-card fixed top-0 w-full z-50 px-6 flex items-center justify-between border-b border-white/10">
                    <div className="flex items-center gap-3 cursor-pointer group" onClick={() => setPhase(PHASES.INTRO)}>
                        <div className="bg-orange-500 p-2 rounded-xl text-white text-xl flex items-center justify-center">🏆</div>
                        <div className="leading-tight">
                            <h1 className="title-font text-lg tracking-tighter text-white">WC 2026</h1>
                            <p className="text-[8px] font-black text-orange-400 uppercase tracking-widest italic">Official Contest</p>
                        </div>
                    </div>
                    <div className="flex items-center gap-2">
                        <button onClick={downloadRegolamentoPDF} className="px-4 py-2 bg-white/5 border border-white/10 rounded-full text-orange-400 font-black uppercase text-[9px] tracking-widest hover:bg-white/10 transition-all hidden sm:block">Regolamento 📜</button>
                        <button onClick={() => setPhase(PHASES.ADMIN)} className={`px-5 py-2 rounded-full font-black text-[10px] uppercase tracking-widest transition-all ${phase === PHASES.ADMIN ? 'bg-orange-500 text-white' : 'bg-white/5 text-orange-400 border border-orange-500/20 hover:bg-white/10'}`}>Area Riservata</button>
                    </div>
                </header>
            );
        }

        function Intro({ playerName, setPlayerName, onStart }) {
            return (
                <div className="flex flex-col items-center justify-center min-h-screen w-full px-6 text-center animate-fadeIn">
                    <div className="w-full max-w-lg flex flex-col items-center gap-10">
                        <div className="hero-logo-container"><T20Logo className="w-full h-auto" /></div>
                        <div className="glass-card p-10 rounded-[3rem] shadow-2xl space-y-8 w-full border border-white/5">
                            <div className="space-y-4 text-center">
                                <label className="block text-[10px] font-black text-orange-400 uppercase tracking-[0.2em]">Nickname Partecipante</label>
                                <input type="text" className="w-full py-5 px-6 bg-white/5 border border-white/10 rounded-2xl text-white font-black text-center focus:border-orange-500 transition-colors outline-none uppercase" value={playerName} onChange={(e) => setPlayerName(e.target.value)} placeholder="" />
                            </div>
                            <button disabled={!playerName} onClick={onStart} className="w-full py-5 orange-button text-white font-black rounded-2xl text-lg uppercase tracking-widest active:scale-95 disabled:opacity-20 transition-all">GIOCA ORA</button>
                        </div>
                    </div>
                </div>
            );
        }

        function MatchView({ fixtures, predictions, onPick, onComplete, title, nextLabel, onAutoFill }) {
            const allMatchIds = Object.values(fixtures).flat().map(m => m.id);
            const done = allMatchIds.filter(id => predictions[id]?.w && predictions[id]?.r && predictions[id]?.wk).length;
            const isComplete = done === allMatchIds.length;
            return (
                <div className="animate-fadeIn py-32 px-4 max-w-4xl mx-auto space-y-16">
                    <div className="text-center space-y-4 relative">
                        <h2 className="text-5xl font-black title-font text-white italic tracking-tighter uppercase">{title}</h2>
                        <div className="h-1.5 w-24 bg-orange-500 mx-auto rounded-full"></div>
                        {onAutoFill && <button onClick={onAutoFill} className="mt-4 px-6 py-2 bg-orange-500/10 border border-orange-500/30 text-orange-500 font-black rounded-full uppercase tracking-widest text-[10px] hover:bg-orange-500 hover:text-white transition-all animate-pulse">Compilazione Rapida ✨</button>}
                    </div>
                    {Object.keys(fixtures).map(g => {
                        const runsT = (['A','B','C','D'].includes(g)) ? "340.5" : "350.5";
                        return (
                            <div key={g} className="space-y-8">
                                <div className="flex items-center gap-6"><h3 className="font-black text-orange-500 uppercase tracking-widest text-sm italic">{g.includes('S8') ? `Super 8 - GRUPPO ${g.slice(-1)}` : `GIRONE ${g}`}</h3><div className="h-px bg-white/10 flex-1"></div></div>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    {fixtures[g].map(m => {
                                        const p = predictions[m.id] || {};
                                        return (
                                            <div key={m.id} className="match-card rounded-[2.5rem] p-4 flex flex-col gap-4 shadow-lg">
                                                <div className="flex items-center justify-between gap-2">
                                                    <div onClick={()=>onPick(m.id, 'w', m.team1.id)} className={`flex-1 flex items-center gap-3 p-3 rounded-[1.5rem] cursor-pointer transition-all ${p.w === m.team1.id ? 'selected-winner' : 'hover:bg-white/5'}`}>
                                                        <Flag id={m.team1.id} size="h-6"/><div className="flex flex-col text-left"><span className="team-label">{m.team1.name}</span><span className={`text-[8px] font-black uppercase ${p.w === m.team1.id ? 'text-white' : 'text-orange-500'}`}>Rank #{m.team1.rank}</span></div>
                                                    </div>
                                                    <div className="px-2 font-black text-slate-700 text-[9px] italic">VS</div>
                                                    <div onClick={()=>onPick(m.id, 'w', m.team2.id)} className={`flex-1 flex items-center justify-end gap-3 p-3 rounded-[1.5rem] text-right cursor-pointer transition-all ${p.w === m.team2.id ? 'selected-winner' : 'hover:bg-white/5'}`}>
                                                        <div className="flex flex-col text-right"><span className="team-label">{m.team2.name}</span><span className={`text-[8px] font-black uppercase ${p.w === m.team2.id ? 'text-white' : 'text-orange-500'}`}>Rank #{m.team2.rank}</span></div><Flag id={m.team2.id} size="h-6"/>
                                                    </div>
                                                </div>
                                                <div className="flex gap-4 border-t border-white/5 pt-3">
                                                    <div className="flex-1 flex flex-col gap-1"><span className="text-[8px] font-black text-slate-600 uppercase text-center mb-1">Runs ({runsT})</span><div className="flex gap-1 justify-center"><button onClick={()=>onPick(m.id, 'r', 'under')} className={`uo-btn flex-1 ${p.r === 'under' ? 'active' : ''}`}>Under</button><button onClick={()=>onPick(m.id, 'r', 'over')} className={`uo-btn flex-1 ${p.r === 'over' ? 'active' : ''}`}>Over</button></div></div>
                                                    <div className="flex-1 flex flex-col gap-1"><span className="text-[8px] font-black text-slate-600 uppercase text-center mb-1">Wkts (13.5)</span><div className="flex gap-1 justify-center"><button onClick={()=>onPick(m.id, 'wk', 'under')} className={`uo-btn flex-1 ${p.wk === 'under' ? 'active' : ''}`}>Under</button><button onClick={()=>onPick(m.id, 'wk', 'over')} className={`uo-btn flex-1 ${p.wk === 'over' ? 'active' : ''}`}>Over</button></div></div>
                                                </div>
                                            </div>
                                        )
                                    })}
                                </div>
                            </div>
                        );
                    })}
                    <div className="fixed bottom-0 left-0 w-full p-6 glass-card border-t border-white/10 z-40 flex flex-col items-center">
                        <button onClick={() => isComplete && onComplete()} className={`w-full max-w-md py-5 rounded-2xl font-black uppercase transition-all shadow-2xl ${isComplete ? 'orange-button text-white active:scale-95' : 'bg-white/5 text-slate-600 cursor-not-allowed'}`}>{nextLabel}</button>
                    </div>
                </div>
            );
        };

        function StandingsView({ standings, title, nextAction, nextLabel }) {
            return (
                <div className="animate-fadeIn py-32 px-4 max-w-5xl mx-auto space-y-12 text-center">
                    <h2 className="text-5xl font-black title-font text-white italic tracking-tighter uppercase">{title}</h2>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                        {Object.keys(standings).map(gk => (
                            <div key={gk} className="glass-card rounded-[3rem] border border-white/10 overflow-hidden shadow-2xl">
                                <div className="bg-white/5 px-8 py-5 flex justify-between items-center border-b border-white/5">
                                    <h3 className="font-black text-xs uppercase tracking-widest text-orange-500 italic">{gk.includes('S8') ? `Super 8 Gr ${gk.slice(-1)}` : `GIRONE ${gk}`}</h3>
                                    <span className="text-[9px] font-black bg-blue-600 px-3 py-1 rounded text-white uppercase tracking-widest">Qualificate</span>
                                </div>
                                <div className="p-6 space-y-3">
                                    {standings[gk].map((t, idx) => (
                                        <div key={t.id} className={`flex justify-between items-center p-4 rounded-2xl transition-all ${idx < 2 ? 'bg-white/5 border border-white/10' : 'opacity-20 grayscale'}`}>
                                            <div className="flex items-center gap-4">
                                                <span className="font-black text-slate-500 text-lg italic w-6">{idx+1}</span><Flag id={t.id} size="h-6"/>
                                                <div className="flex flex-col text-left"><span className="font-black text-sm uppercase text-slate-200">{t.name}</span><span className="text-[8px] font-black text-orange-500 uppercase tracking-widest">ICC Rank #{t.rank}</span></div>
                                            </div>
                                            <span className="font-black text-orange-500 text-sm italic">{t.points} PT</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        ))}
                    </div>
                    <div className="fixed bottom-0 left-0 w-full p-8 glass-card z-40 border-t border-white/10">
                        <button onClick={nextAction} className="w-full max-w-md py-5 orange-button text-white font-black rounded-3xl shadow-2xl uppercase tracking-widest active:scale-95 transition-all text-sm">{nextLabel} ➡️</button>
                    </div>
                </div>
            );
        }

        function Summary({ playerName, champion, tieRuns, tieWkts, copyCode, resetGame, matchPredictions, isAuto }) {
            return (
                <div className="py-32 px-4 text-center space-y-8 animate-fadeIn pb-48">
                    <div className="bg-slate-900 rounded-[4rem] shadow-2xl border border-white/5 overflow-hidden max-w-md mx-auto">
                        <div className="bg-orange-500 p-16 text-white relative text-center">
                            <div className="text-8xl mb-6 drop-shadow-2xl">🏆</div>
                            <h2 className="text-4xl font-black title-font italic tracking-tighter uppercase">Riepilogo Pronostico</h2>
                            <p className="text-white/70 text-[10px] font-black uppercase tracking-[0.3em] mt-4 italic">{playerName} {isAuto && "(AUTO ✨)"}</p>
                        </div>
                        <div className="p-12 space-y-12 text-center">
                            <span className="text-[10px] font-black text-orange-500 bg-orange-500/10 px-6 py-2 rounded-full uppercase tracking-widest italic border border-orange-500/20">Campione Mondiale</span>
                            <div className="text-5xl font-black text-white title-font italic tracking-tighter leading-none">{champion?.name}</div>
                            <div className="grid grid-cols-2 gap-4">
                                <div className="bg-white/5 p-6 rounded-[2rem] border border-white/10"><div className="text-[9px] font-black text-slate-500 uppercase mb-2">Runs Scarto</div><div className="text-4xl font-black text-orange-500 italic">{tieRuns}</div></div>
                                <div className="bg-white/5 p-6 rounded-[2rem] border border-white/10"><div className="text-[9px] font-black text-slate-500 uppercase mb-2">Wkts Risp.</div><div className="text-4xl font-black text-orange-500 italic">{tieWkts}</div></div>
                            </div>
                            <div className="space-y-4">
                                <button onClick={copyCode} className="w-full py-6 orange-button text-white font-black rounded-[2rem] uppercase tracking-widest shadow-2xl active:scale-95 text-xs">COPIA CODICE PER ADMIN</button>
                            </div>
                        </div>
                    </div>

        function App() {
            const [phase, setPhase] = useState(PHASES.INTRO);
            const [playerName, setPlayerName] = useState('');
            const [matchPredictions, setMatchPredictions] = useState({});
            const [groupStandings, setGroupStandings] = useState({});
            const [super8Groups, setSuper8Groups] = useState({});
            const [super8Fixtures, setSuper8Fixtures] = useState({});

                const rr = localStorage.getItem('t20_real_results'); if(rr) setRealResults(JSON.parse(rr));
            }, []);

            const notify = (msg) => { setNotification(msg); setTimeout(() => setNotification(null), 3500); };
            const onPick = (mid, field, val) => { const curr = matchPredictions[mid] || {}; setMatchPredictions(prev => ({ ...prev, [mid]: { ...curr, [field]: val } })); };

            const downloadRegolamentoPDF = () => {
                const doc = new jsPDF();
                const titleColor = [15, 23, 42];
                doc.setFillColor(titleColor[0], titleColor[1], titleColor[2]); doc.rect(0, 0, 210, 45, 'F');
                doc.setTextColor(255, 255, 255); doc.setFontSize(22); doc.text("DISCIPLINARE TECNICO - T20 WORLD CUP 2026", 105, 25, { align: 'center' });
                doc.setTextColor(0,0,0); doc.setFontSize(14); doc.text("1. QUADRO NORMATIVO E ATTRIBUZIONE PUNTEGGI", 14, 60);
                doc.setFontSize(10);
                const introT = "Il presente disciplinare regola le modalità di partecipazione e il calcolo delle metriche di punteggio per il contest '2026 T20 World Cup Predictor'. Nota bene: il punteggio di ogni partecipante rimane a 0 fino all'inserimento del primo dato reale da parte dell'amministratore.";
                doc.text(doc.splitTextToSize(introT, 180), 14, 67);
                const stageD = [
                    ["Qualificazione Super 8", "50 PT per singola squadra identificata"],
                    ["Qualificazione Semifinali", "80 PT per singola squadra identificata"],
                    ["Qualificazione Finale", "120 PT per singola squadra identificata"],
                    ["Finalista Runner-up (2°)", "180 PT (Identificazione esatta sconfitta in finale)"],
                    ["Vincitore Assoluto (Champion)", "250 PT (Identificazione esatta vincitore torneo)"]
                ];
                doc.autoTable({ startY: 85, head: [['Target Qualificazione', 'Punteggio Fisso']], body: stageD, theme: 'grid', styles: { fontSize: 9 } });
                doc.save("Regolamento_Ufficiale_Admin_T20.pdf");
            };

            const handleAutoFill = () => {
                if(!playerName) return; setIsAuto(true);
                const randomUO = () => Math.random() > 0.5 ? 'over' : 'under';
                const randomW = (m) => Math.random() > 0.5 ? m.team1.id : m.team2.id;
                const newPreds = {};
                Object.values(ALL_GROUP_FIXTURES).flat().forEach(m => { newPreds[m.id] = { w: randomW(m), r: randomUO(), wk: randomUO() }; });
                const gs = {}; Object.keys(INITIAL_GROUPS).forEach(g => { gs[g] = calcRank(INITIAL_GROUPS[g], ALL_GROUP_FIXTURES[g], newPreds); });
                const G1 = [gs.A[0], gs.B[1], gs.C[0], gs.D[1]].filter(Boolean);
                const G2 = [gs.A[1], gs.B[0], gs.C[1], gs.D[0]].filter(Boolean);
                const s8f = { S8G1: generateFixtures(G1, 'S8G1'), S8G2: generateFixtures(G2, 'S8G2') };
                Object.values(s8f).flat().forEach(m => { newPreds[m.id] = { w: randomW(m), r: randomUO(), wk: randomUO() }; });
                const s8s = { S8G1: calcRank(G1, s8f.S8G1, newPreds), S8G2: calcRank(G2, s8f.S8G2, newPreds) };
                const sw = [s8s.S8G1[0], s8s.S8G2[0]];
                newPreds['semi1'] = { w: sw[0].id, r: randomUO(), wk: randomUO() };
                newPreds['semi2'] = { w: sw[1].id, r: randomUO(), wk: randomUO() };
                const champ = Math.random() > 0.5 ? sw[0] : sw[1];
                newPreds['final_match'] = { w: champ.id, r: randomUO(), wk: randomUO() };
                setGroupStandings(gs); setSuper8Fixtures(s8f); setSuper8Standings(s8s); setSemiWinners(sw); setChampion(champ); setMatchPredictions(newPreds);
                setTieRuns(Math.floor(Math.random() * 50) + 1); setTieWkts(Math.floor(Math.random() * 10));
                setPhase(PHASES.SUMMARY); notify("SIMULAZIONE COMPLETATA! ✨");
            };

            const resetGame = () => { if(confirm('Reset?')) { setMatchPredictions({}); setChampion(null); setPhase(PHASES.INTRO); setIsAuto(false); } };

            return (
                <div className="min-h-screen flex flex-col relative">
                    {notification && <div className="toast-notification animate-fadeIn"><div className="glass-card bg-orange-500 text-white px-8 py-5 rounded-[2rem] font-black shadow-2xl border-2 border-white/20 uppercase text-[10px] tracking-widest flex items-center gap-4"><span className="text-xl flex items-center justify-center">✨</span> {notification}</div></div>}
                    <Header setPhase={setPhase} phase={phase} downloadRegolamentoPDF={downloadRegolamentoPDF} />
                    <main className="flex-grow flex flex-col items-center justify-center">
                        {phase === PHASES.INTRO && <Intro playerName={playerName} setPlayerName={setPlayerName} onStart={()=>setPhase(PHASES.MATCHES)} />}
                        {phase !== PHASES.INTRO && (
                            <div className="w-full flex-grow">
                                {phase === PHASES.MATCHES && <MatchView fixtures={ALL_GROUP_FIXTURES} predictions={matchPredictions} onPick={onPick} onAutoFill={handleAutoFill} onComplete={() => { const s = {}; Object.keys(INITIAL_GROUPS).forEach(g => s[g] = calcRank(INITIAL_GROUPS[g], ALL_GROUP_FIXTURES[g], matchPredictions)); setGroupStandings(s); setPhase(PHASES.STANDINGS); }} title="Fase a Gironi" nextLabel="Vedi Classifiche" />}
                                {phase === PHASES.STANDINGS && <StandingsView standings={groupStandings} title="Classifiche Gironi" nextLabel="Vai ai Super 8" nextAction={() => { const G1 = [groupStandings.A[0], groupStandings.B[1], groupStandings.C[0], groupStandings.D[1]].filter(Boolean); const G2 = [groupStandings.A[1], groupStandings.B[0], groupStandings.C[1], groupStandings.D[0]].filter(Boolean); setSuper8Groups({ G1, G2 }); setSuper8Fixtures({ S8G1: generateFixtures(G1, 'S8G1'), S8G2: generateFixtures(G2, 'S8G2') }); setPhase(PHASES.SUPER8_MATCHES); }} />}
                                {phase === PHASES.SUPER8_MATCHES && <MatchView fixtures={super8Fixtures} predictions={matchPredictions} onPick={onPick} title="Fase Super 8" nextLabel="Vedi Classifiche S8" onComplete={() => { setSuper8Standings({ S8G1: calcRank(super8Groups.G1, super8Fixtures.S8G1, matchPredictions), S8G2: calcRank(super8Groups.G2, super8Fixtures.S8G2, matchPredictions) }); setPhase(PHASES.SUPER8_STANDINGS); }} />}
                                {phase === PHASES.SUPER8_STANDINGS && <StandingsView standings={super8Standings} title="Super 8 Ranking" nextLabel="Vai alle Finali" nextAction={() => setPhase(PHASES.SEMIS_FINAL)} />}
                                {phase === PHASES.SEMIS_FINAL && (
                                    <div className="py-32 px-4 space-y-16 animate-fadeIn max-w-4xl mx-auto text-center flex-grow">
                                        <h2 className="text-6xl font-black title-font text-white italic tracking-tighter uppercase">Knockouts</h2>
                                        <div className="grid md:grid-cols-2 gap-8 text-center">
                                            {[ { id: "semi1", title: "Semi 1", teams: [super8Standings.S8G1[0], super8Standings.S8G2[1]], sIdx: 0 }, { id: "semi2", title: "Semi 2", teams: [super8Standings.S8G2[0], super8Standings.S8G1[1]], sIdx: 1 } ].map(s => (
                                                <div key={s.id} className="glass-card p-8 rounded-[3rem] shadow-2xl border border-white/5 space-y-4">
                                                    <div className="text-[10px] font-black text-orange-500 uppercase">{s.title}</div>
                                                    {s.teams.map(t => t && <button key={t.id} onClick={() => { const nw = [...semiWinners]; nw[s.sIdx] = t; setSemiWinners(nw); onPick(s.id, 'w', t.id); }} className={`w-full p-4 rounded-2xl flex justify-between items-center border-2 transition-all ${matchPredictions[s.id]?.w === t.id ? 'border-orange-500 bg-orange-500 text-white shadow-md' : 'bg-white/5 text-slate-400'}`}>{t.name} <Flag id={t.id} size="h-6"/></button>)}
                                                    {matchPredictions[s.id]?.w && (
                                                        <div className="flex gap-4 pt-4 border-t border-white/5">
                                                            <div className="flex-1 space-y-1"><span className="text-[8px] font-black text-slate-500 uppercase">Runs (350.5)</span><div className="flex gap-1"><button onClick={() => onPick(s.id, 'r', 'under')} className={`uo-btn flex-1 ${matchPredictions[s.id]?.r === 'under' ? 'active' : ''}`}>U</button><button onClick={() => onPick(s.id, 'r', 'over')} className={`uo-btn flex-1 ${matchPredictions[s.id]?.r === 'over' ? 'active' : ''}`}>O</button></div></div>
                                                            <div className="flex-1 space-y-1"><span className="text-[8px] font-black text-slate-500 uppercase">Wkts (13.5)</span><div className="flex gap-1"><button onClick={() => onPick(s.id, 'wk', 'under')} className={`uo-btn flex-1 ${matchPredictions[s.id]?.wk === 'under' ? 'active' : ''}`}>U</button><button onClick={() => onPick(s.id, 'wk', 'over')} className={`uo-btn flex-1 ${matchPredictions[s.id]?.wk === 'over' ? 'active' : ''}`}>O</button></div></div>
                                                        </div>
                                                    )}
                                                </div>
                                            ))}
                                        </div>
                                        {matchPredictions['semi1']?.w && matchPredictions['semi2']?.w && (
                                            <div className="space-y-12 mt-12 animate-fadeIn text-center">
                                                <h3 className="text-3xl font-black text-white italic uppercase tracking-tighter">Gran Finale</h3>
                                                <div className="flex justify-center gap-12">
                                                    {[semiWinners[0], semiWinners[1]].map(t => t && (
                                                        <button key={t.id} onClick={() => { setChampion(t); onPick('final_match', 'w', t.id); }} className={`flex flex-col items-center gap-4 transition-all ${matchPredictions['final_match']?.w === t.id ? 'scale-110' : 'grayscale opacity-30 hover:opacity-60'}`}>
                                                            <div className="text-6xl">🏆</div>
                                                            <div className="flex flex-col"><span className="team-label text-white">{t.name}</span><span className="text-[8px] font-black text-orange-500">VINCITORE</span></div>
                                                        </button>
                                                    ))}
                                                </div>
                                                {matchPredictions['final_match']?.w && (
                                                    <div className="max-w-md mx-auto space-y-8 glass-card p-8 rounded-[3rem] border border-white/5">
                                                        <div className="flex gap-4"><div className="flex-1 space-y-1"><span className="text-[8px] font-black text-slate-500 uppercase">Runs Final (350.5)</span><div className="flex gap-1"><button onClick={() => onPick('final_match', 'r', 'under')} className={`uo-btn flex-1 ${matchPredictions['final_match']?.r === 'under' ? 'active' : ''}`}>U</button><button onClick={() => onPick('final_match', 'r', 'over')} className={`uo-btn flex-1 ${matchPredictions['final_match']?.r === 'over' ? 'active' : ''}`}>O</button></div></div><div className="flex-1 space-y-1"><span className="text-[8px] font-black text-slate-500 uppercase">Wkts Final (13.5)</span><div className="flex gap-1"><button onClick={() => onPick('final_match', 'wk', 'under')} className={`uo-btn flex-1 ${matchPredictions['final_match']?.wk === 'under' ? 'active' : ''}`}>U</button><button onClick={() => onPick('final_match', 'wk', 'over')} className={`uo-btn flex-1 ${matchPredictions['final_match']?.wk === 'over' ? 'active' : ''}`}>O</button></div></div></div>
                                                        <div className="grid grid-cols-2 gap-4 border-t border-white/5 pt-6 text-center"><div><label className="text-[9px] font-black text-slate-500 uppercase italic">Runs Scarto</label><input type="number" className="w-full p-4 bg-white/5 border border-white/10 rounded-xl text-center font-black" value={tieRuns} onChange={e=>setTieRuns(e.target.value)}/></div><div><label className="text-[9px] font-black text-slate-500 uppercase italic">Wkts Risp..</label><input type="number" className="w-full p-4 bg-white/5 border border-white/10 rounded-xl text-center font-black" value={tieWkts} onChange={e=>setTieWkts(e.target.value)}/></div></div>
                                                        <button onClick={()=>setPhase(PHASES.SUMMARY)} className="w-full py-5 orange-button text-white font-black rounded-2xl uppercase shadow-2xl text-xs tracking-widest">Concludi Pronostico</button>
                                                    </div>
                                                )}
                                            </div>
                                        )}
                                    </div>
                                )}
                                {phase === PHASES.SUMMARY && <Summary playerName={playerName} champion={champion} tieRuns={tieRuns} tieWkts={tieWkts} copyCode={() => { const data = { n: playerName, cid: champion?.id, mp: matchPredictions, tr: tieRuns, tw: tieWkts, d: new Date().toLocaleDateString('it-IT'), af: isAuto }; const code = 'T20-' + b64Encode(JSON.stringify(data)); const el = document.createElement('textarea'); el.value = code; document.body.appendChild(el); el.select(); document.execCommand('copy'); notify("CODICE COPIATO! ✅"); document.body.removeChild(el); }} resetGame={resetGame} matchPredictions={matchPredictions} isAuto={isAuto} />}
                                {phase === PHASES.ADMIN && <AdminPanel leaderboard={leaderboard} setLeaderboard={setLeaderboard} realResults={realResults} setRealResults={setRealResults} notify={notify} />}
                            </div>
                        )}
                    </main>
                    {phase !== PHASES.INTRO && <footer className="py-20 text-center text-slate-800 text-[11px] font-black uppercase tracking-[0.7em] border-t border-white/5 mt-auto italic">ICC Men's T20 World Cup</footer>}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
